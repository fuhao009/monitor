version: '3.8'

services:
  web-audio:
    image: web-audio:latest
    container_name: web-audio
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - web-audio-network

networks:
  web-audio-network:
    driver: bridge
